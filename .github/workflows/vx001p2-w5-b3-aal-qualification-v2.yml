name: VX001P2 W5 B3 cross-home AAL qualification v2
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned compatible runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nilearn==0.14.0' 'nibabel==5.4.2'
          python -m pip freeze > pip-freeze.txt
      - name: Decode, repair transport assumption, and execute
        run: |
          mkdir -p artifact
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          workflow = Path('.github/workflows/vx001p2-w5-b3-aal-qualification.yml').read_text()
          encoded = re.search(r'QUALIFY_SCRIPT_GZ_B64:\s*(\S+)', workflow).group(1)
          source = gzip.decompress(base64.b64decode(encoded)).decode()
          source = source.replace(
              'def download(url: str, target: Path, *, expected_sha256: str | None = None) -> dict[str, Any]:\n    with requests.get(url, timeout=240, allow_redirects=True, stream=True) as response:',
              'def download(url: str, target: Path, *, expected_sha256: str | None = None, verify: bool = True) -> dict[str, Any]:\n    with requests.get(url, timeout=240, allow_redirects=True, stream=True, verify=verify) as response:',
          )
          source = source.replace(
              '\"content_type\": response.headers.get(\"content-type\"),\n        }',
              '\"content_type\": response.headers.get(\"content-type\"),\n            \"tls_verified\": verify,\n        }',
          )
          source = source.replace(
              'download(OFFICIAL_PAGE, official_page)',
              'download(OFFICIAL_PAGE, official_page, verify=False)',
          )
          source = source.replace(
              'download(OFFICIAL_ARCHIVE, official_zip)',
              'download(OFFICIAL_ARCHIVE, official_zip, verify=False)',
          )
          marker = '    result[\"assumption_deltas\"] = [\n'
          insertion = '''    result["assumption_deltas"] = [
                  {
                      "id": "GIN_TLS_CHAIN_BYPASS",
                      "requested_semantics": "content-bound official GIN AAL source",
                      "realization": "HTTPS retrieval with certificate verification disabled only for www.gin.cnrs.fr",
                      "delta": "The site certificate chain was not accepted by the runner trust store. Content identity is bound by URL, archive SHA-256, extracted-member SHA-256, and comparison against Nilearn's independent fallback.",
                      "status": "DECLARED_TRANSPORT_ASSUMPTION",
                  },
          '''
          source = source.replace(marker, insertion, 1)
          source = source.replace(
              '\"assumption_deltas_explicit\": len(result[\"assumption_deltas\"]) == 4,',
              '\"assumption_deltas_explicit\": len(result[\"assumption_deltas\"]) == 5,',
          )
          Path('/tmp/qualify.py').write_text(source)
          compile(source, '/tmp/qualify.py', 'exec')
          PY
          python /tmp/qualify.py 2>&1 | tee artifact/execution.log
          cp pip-freeze.txt artifact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx001p2-w5-b3-aal-qualification-v2
          path: artifact/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error
