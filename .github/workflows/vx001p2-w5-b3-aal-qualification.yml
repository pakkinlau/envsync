name: VX001P2 W5 B3 cross-home AAL qualification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned compatible runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nilearn==0.14.0' 'nibabel==5.4.2'
          python -m pip freeze > pip-freeze.txt
      - name: Execute exact atlas and provider qualification
        env:
          QUALIFY_SCRIPT_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/qualify.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['QUALIFY_SCRIPT_GZ_B64'])))
          PY
          python /tmp/qualify.py 2>&1 | tee artifact/execution.log
          cp pip-freeze.txt artifact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx001p2-w5-b3-aal-qualification
          path: artifact/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error
